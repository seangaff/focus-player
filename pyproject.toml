[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-player"
version = "0.1.0"
description = "TUI music player that raises the volume while you type and fades it when you stop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "just_playback==0.1.8",
    "pynput==1.8.1",
    "textual==6.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
midi = [
    "pygame==2.6.1",
    "mido==1.3.3",
    "python-rtmidi==1.5.8",
]

[project.scripts]
focus-player = "main:main"

[tool.setuptools]
py-modules = ["main", "monitor", "player", "pomodoro", "session", "tui"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
