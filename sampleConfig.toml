# Focus Player Sample Config
# Loaded in as starting sessions state

[stats]
total_chars = 0
total_time = 0
completed_sessions = 0
completed_break = 0
average_wpm = 0
max_wpm = 0

[player]
alert_sound = "../sounds/notification.mp3"
mode = "adaptive"
smoothing_step = 0.05

[player.foreground]
folder = "~/Music/sets"
default_song = "socialnetwork.mp3"
shuffle = true
loop = false
max_volume = 100

[player.background]
folder = "~/Music/ambience"
default_song = "brownnoise.mp3"
shuffle = false
loop = true
max_volume = 80

[monitor]
window_seconds = 15
keys_ignored = ["Key.cmd"]

[pomodoro]
# Times in minutes
work_interval = 25
break_interval = 5
alert_on_complete = true
